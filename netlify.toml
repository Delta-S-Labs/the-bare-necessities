# The Bare Necessities — static site (no real build).
#
# The Netlify site forces a `dist` publish directory at deploy time. Rather
# than fight that, the "build" below just copies the static files into dist/
# so the deploy always finds it.
[build]
  base = ""
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html styles.css script.js favicon.svg public dist/"

# Long cache for static art/assets (filenames are stable).
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Always revalidate the HTML so updates show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
