# The Bare Necessities — static site, no build step.
# Netlify serves index.html straight from the repo root.
#
# NOTE: a non-empty `command` here is deliberate — it overrides any build
# command left in the Netlify UI (this site previously ran the Baloo app's
# Vite build, which fails here since there's no npm project). This no-op
# succeeds and produces nothing to build.
[build]
  base = ""
  publish = "."
  command = "echo 'Static site — nothing to build.'"

# Long cache for static art/assets (filenames are stable).
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Always revalidate the HTML so updates show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
